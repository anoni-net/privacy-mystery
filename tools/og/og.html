<!DOCTYPE html>
<!-- Source for the social preview images (1200×630). scripts/make_og.mjs opens this page once
     per card with the card's text in the URL hash and takes a screenshot. It is a local file
     used to make the images, never part of the site, so it may use JavaScript.
     Layout follows the anoni.net share card (docs: community/visual-guide): cyan-900 ground,
     cyan-300/500/700 bars down the left edge, the mono white logo and site name at the top,
     then the title, the description and the address. The game's own mark, the night heron
     from site/favicon.svg, stands on the right.
     logo-white.svg is the anoni.net logo, copied unchanged from anoni-net/www static/brand/
     (CC BY 4.0); see https://anoni.net/brand/ for how it may be used. -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  /*__FONTS__*/
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 64px 96px 0 112px;
    background: #003e57; color: #ffffff;
    font-family: "Noto Sans TC", "Noto Sans CJK TC", "Public Sans", sans-serif;
  }
  :lang(en) body { font-family: "Public Sans", "Noto Sans TC", sans-serif; }
  .bars { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; display: flex; flex-direction: column; }
  .bars i { flex: 1; }
  .site { display: flex; align-items: center; gap: 16px; font-size: 28px; color: #e0f4ff; letter-spacing: .02em; }
  .site img { width: 52px; height: 52px; }
  .text { width: 690px; margin-top: 44px; }
  .kicker { font-size: 26px; letter-spacing: .24em; color: #e3a33b; margin: 0 0 6px; }
  :lang(en) .kicker { letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-size: 92px; font-weight: 700; line-height: 1.12; letter-spacing: .06em; margin: 0; }
  :lang(en) h1 { letter-spacing: 0; font-size: 78px; }
  .hook { font-size: 38px; color: #e3a33b; margin: 12px 0 0; }
  .desc { font-size: 28px; line-height: 1.5; color: #b3e3ff; margin: 14px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  :lang(en) .desc { font-size: 25px; line-height: 1.45; -webkit-line-clamp: 4; }
  .url { position: absolute; left: 112px; bottom: 48px; font-size: 26px; color: #4dbfff; letter-spacing: .02em; }
  .heron { position: absolute; right: 44px; top: 196px; width: 340px; height: 340px; }
</style>
</head>
<body>
  <div class="bars" aria-hidden="true"><i style="background:#4dbfff"></i><i style="background:#00aeff"></i><i style="background:#0089bf"></i></div>
  <div class="site"><img src="logo-white.svg" alt=""><span id="site"></span></div>
  <div class="text">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="hook" id="hook"></p>
    <p class="desc" id="desc"></p>
  </div>
  <div class="url" id="url"></div>
  <!-- the heron from site/favicon.svg, without its tile -->
  <svg class="heron" viewBox="0 8 64 52" aria-hidden="true">
    <path fill="#e3a33b" d="M16 21.5C17.5 17.5 22 15.8 26.5 16.8 33 18 42 22 49 30l7 8.5h-8.5C45 44 39 47.5 32 47.5c-7.5 0-13.5-4.5-15.5-11.5-.9-3.5-.9-7-.5-9.5z"/>
    <path fill="#e3a33b" d="M16.8 21.6 3 24.3l13.8 2.6z"/>
    <path fill="#14232b" d="M16 21.5C17.5 17.5 22 15.8 26.5 16.8 33 18 42 22 49 30l7 8.5h-3.2l-7.4-7.6C40 26 33 23.4 26 23c-4-.2-7.6.6-9.8 1.8z"/>
    <path fill="none" stroke="#e0f4ff" stroke-width="1.4" stroke-linecap="round" d="M27 19.2c5.2 1.4 10 5 12.6 10.6"/>
    <circle cx="21.4" cy="20.9" r="1.8" fill="#ef5350"/>
    <path stroke="#e3a33b" stroke-width="2.4" stroke-linecap="round" d="M29.8 47.2 29 55M36.3 47.4l.6 7.6"/>
    <path stroke="#4dbfff" stroke-width="2.6" stroke-linecap="round" d="M17 55.6h34"/>
  </svg>
<script>
  // #{"lang":"zh-Hant","site":…,"kicker":…,"title":…,"hook":…,"desc":…,"url":…}
  var card = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.documentElement.lang = card.lang;
  ['site', 'kicker', 'title', 'hook', 'desc', 'url'].forEach(function (k) {
    var el = document.getElementById(k);
    if (card[k]) el.textContent = card[k]; else el.remove();
  });
</script>
</body>
</html>
